name: Publish Maven Central

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kaus-io/prism-motion'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      RELEASE_SOURCE_DIRECTORY: ${{ github.workspace }}/tag-source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.release.tag_name }}
          path: tag-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Publish the release to Maven Central or skip an existing version
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 -B publisher/scripts/publish-release-to-central.py
